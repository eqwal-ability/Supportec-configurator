<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supportec Seating Configurator – Eqwal Ability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003151; --navy-70:#4d6f85; --gold:#CEA434; --gold-dk:#b88f26; --gold-lt:#F6EEDB;
    --circle:#F5F5F3; --line:#C5D0D8; --line-lt:#E3E8EC; --muted:#7f8fa0; --red:#C53030;
    --white:#fff; --r:4px;
    --serif:'Fraunces','Georgia',serif; --sans:'Noto Sans',system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:var(--sans);color:var(--navy);background:var(--white);min-height:100vh;overflow-x:hidden;position:relative;}
  button,input,select{font:inherit;color:inherit;}

  /* ---------- decorative circle (left) ---------- */
  .bg-circle{position:fixed;z-index:0;border-radius:50%;background:var(--circle);
    width:62.2vw;height:62.2vw;left:-22.9vw;top:-7.5vw;pointer-events:none;}

  /* ---------- logo ---------- */
  .logo{position:absolute;z-index:3;top:clamp(18px,2.9vw,31px);left:clamp(16px,2.9vw,55px);width:clamp(120px,11.4vw,219px);}
  .logo img{width:100%;height:auto;display:block;}

  /* ---------- page frame ---------- */
  .page{position:relative;z-index:1;min-height:100vh;padding:clamp(20px,min(4.4vw,6vh),84px) clamp(16px,4vw,64px) 20px;}
  .layout{display:grid;grid-template-columns:50% 50%;max-width:1920px;margin:0 auto;}
  .hero{grid-column:1;display:flex;align-items:flex-start;justify-content:center;
    padding-top:max(0px,calc(clamp(18px,2.9vw,31px) + clamp(120px,11.4vw,219px) * .466 + 24px - clamp(20px,min(4.4vw,6vh),84px)));}
  .main{grid-column:2;max-width:640px;}

  /* ---------- seat preview (layers on top of the complete seat) ---------- */
  .preview{position:sticky;top:24px;width:min(34vw,640px,calc((100vh - clamp(18px,2.9vw,31px) - clamp(120px,11.4vw,219px) * .466 - 60px) * 1.037));
    aspect-ratio:1363/1315;margin-left:-3vw;}
  .preview img,.preview canvas{position:absolute;display:block;user-select:none;-webkit-user-drag:none;}
  .preview img{inset:0;width:100%;height:100%;pointer-events:none;}
  .preview canvas{transition:filter .2s;}
  .preview canvas[hidden]{display:none;}
  .preview canvas.hl{filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 8px rgba(206,164,52,.7));}

  /* ---------- title + section labels ---------- */
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,min(1.75vw,3.3vh),34px);letter-spacing:-.005em;line-height:1.2;
    margin-bottom:clamp(18px,3.4vh,40px);}
  h2{font-family:var(--sans);font-weight:700;font-size:clamp(12px,min(.8vw,1.6vh),15px);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
    margin-bottom:clamp(8px,1.4vh,16px);}
  h2.foam-h{margin-top:clamp(18px,3.2vh,40px);}

  .step{display:none;animation:fade .3s ease;}
  .step.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- structure questions ---------- */
  .rows{display:flex;flex-direction:column;gap:clamp(6px,1vh,12px);padding-left:12px;}
  .row{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;min-height:30px;font-size:clamp(15px,min(1vw,1.9vh),19px);}

  .yn{display:inline-flex;flex-wrap:wrap;gap:6px;border-radius:22px;}
  .yn input{position:absolute;opacity:0;pointer-events:none;}
  .yn label{display:inline-block;min-width:54px;text-align:center;padding:2px 14px;border:1px solid var(--line);
    border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .15s;user-select:none;background:#fff;}
  .yn label:hover{border-color:var(--navy-70);}
  .yn input:checked + label{background:var(--navy);border-color:var(--navy);color:#fff;}
  .yn input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px;}
  .yn.wide label{min-width:72px;}
  .yn.invalid{outline:2px solid var(--red);outline-offset:4px;}

  /* ---------- foam accordion ---------- */
  .foam{border-top:1px solid transparent;}
  .fr{border-bottom:1px solid var(--line-lt);}
  .fr .hd{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;cursor:pointer;text-align:left;
    padding:clamp(8px,1.35vh,13px) 12px;font-size:clamp(15px,min(1vw,1.9vh),19px);transition:background .15s;}
  .fr .hd:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .fr .nm{flex:1;}
  .fr .val{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .fr .val i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,49,81,.25);}
  .fr.set .val{color:var(--navy);font-size:13px;}
  .fr .chev{width:14px;height:14px;flex-shrink:0;color:var(--navy-70);transition:transform .2s;}
  .fr.open .chev{transform:rotate(180deg);}
  .fr.hl{border-bottom-color:var(--gold);}
  .fr.hl .hd,.fr.open .hd{background:rgba(246,238,219,.55);}
  .fr.flash .hd{animation:flash 1s ease;}
  @keyframes flash{0%,50%{background:var(--gold-lt);}100%{background:rgba(246,238,219,.55);}}
  .fr.invalid .nm{color:var(--red);}
  .fr.invalid .val{color:var(--red);}

  .opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s ease,padding .25s ease;}
  .fr.open .opts{max-height:120px;padding:6px 12px 14px;}
  .fo{position:relative;display:block;}
  .fo input{position:absolute;opacity:0;pointer-events:none;}
  .fo label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;
    cursor:pointer;background:#fff;transition:all .15s;user-select:none;white-space:nowrap;line-height:1.2;}
  .fo label .c{display:inline-flex;align-items:center;gap:6px;font-size:14px;}
  .fo label i{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,49,81,.25);}
  .fo label small{font-size:11px;color:var(--muted);letter-spacing:.03em;}
  .fo label:hover{border-color:var(--navy-70);}
  .fo input:checked + label{background:var(--navy);border-color:var(--navy);color:#fff;}
  .fo input:checked + label small{color:rgba(255,255,255,.75);}
  .fo input:checked + label i{box-shadow:0 0 0 1.5px #fff;}
  .fo input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px;}

  /* buttons */
  .actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;flex-wrap:wrap;margin-top:clamp(18px,3.4vh,40px);}
  .btn{display:inline-flex;align-items:center;gap:6px;height:clamp(38px,4.4vh,46px);padding:0 22px;border:none;border-radius:var(--r);
    background:var(--gold);color:var(--navy);font-size:clamp(14px,min(.95vw,1.8vh),17px);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,49,81,.12);transition:background .15s,transform .1s;}
  .btn:hover{background:var(--gold-dk);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--navy);outline-offset:3px;}
  .btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--circle);}
  .msg{color:var(--red);font-size:14px;min-height:20px;}

  .soon{font-size:clamp(15px,min(1vw,1.9vh),19px);color:var(--navy-70);line-height:1.6;}

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    .bg-circle{width:150vw;height:150vw;left:-75vw;top:-95vw;}
    .page{padding-top:clamp(96px,22vw,130px);}
    .layout{grid-template-columns:1fr;}
    .hero{grid-column:1;padding-top:0;margin-bottom:20px;}
    .preview{position:relative;top:0;width:min(100%,440px);margin-left:0;}
    .main{grid-column:1;max-width:none;}
    .rows{padding-left:0;}
    .row{gap:6px 14px;}
    .actions{justify-content:stretch;}
    .actions .msg{flex-basis:100%;min-height:0;}
    .actions .btn{flex:1;justify-content:center;}
  }
  @media (max-width:480px){
    .opts{gap:4px;padding:0 4px;}
    .fr.open .opts{padding:6px 4px 12px;}
    .fo label .c{font-size:12px;flex-direction:column;gap:2px;}
    .fo label small{font-size:10px;}
    .fr .hd{padding-left:4px;padding-right:4px;}
  }
</style>
</head>

  /* foam rows, in the order of the design */
  var ROWS = [
    { id:'back',      label:'Back' },
    { id:'barrier',   label:'Barrier' },
    { id:'tuber',     label:'Seating tuber' },
    { id:'abduction', label:'Abduction wedge' },
    { id:'leg_r',     label:'Leg lateral right' },
    { id:'leg_l',     label:'Leg lateral left' },
    { id:'thor_r',    label:'Thoracal lateral right' },
    { id:'thor_l',    label:'Thoracal lateral left' }
  ];

  var $ = function(s,r){return (r||document).querySelector(s);};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  function radio(n){var e=$('input[name="'+n+'"]:checked'); return e?e.value:'';}

  /* ---------- pill choices ---------- */
  $$('.yn').forEach(function(el){
    var n=el.dataset.name;
    el.dataset.options.split('|').forEach(function(v){
      var id=n+'-'+v.toLowerCase().replace(/\s+/g,'-');
      var i=document.createElement('input'); i.type='radio'; i.name=n; i.value=v; i.id=id;
      var l=document.createElement('label'); l.htmlFor=id; l.textContent=v;
      el.appendChild(i); el.appendChild(l);
    });
  });

  /* ---------- preview: one canvas per layer, tinted with the chosen foam ---------- */
  var preview=$('#preview'), state={}, canv={};
  LAYERS.forEach(function(L){
    var c=document.createElement('canvas');
    c.style.left=L.box[0]+'%'; c.style.top=L.box[1]+'%'; c.style.width=L.box[2]+'%'; c.style.height=L.box[3]+'%';
    var img=new Image();
    img.onload=function(){ c.width=img.naturalWidth; c.height=img.naturalHeight; L.ready=true; paint(L); };
    img.src=L.src; L.img=img; L.canvas=c;
    preview.appendChild(c);
    (canv[L.row]=canv[L.row]||[]).push(c);
  });
  function paint(L){
    if(!L.ready) return;
    var c=L.canvas, x=c.getContext('2d'), f=state[L.row];
    x.globalCompositeOperation='source-over';
    x.clearRect(0,0,c.width,c.height);
    x.drawImage(L.img,0,0);
    if(f){
      x.globalCompositeOperation='multiply'; x.fillStyle=f.hex; x.fillRect(0,0,c.width,c.height);
      x.globalCompositeOperation='destination-in'; x.drawImage(L.img,0,0);
      x.globalCompositeOperation='source-over';
    }
  }
  /* ventilation holes: "No" shows the back without ventilation */
  function visibility(){
    var vent=radio('ventilation');
    LAYERS.forEach(function(L){
      if(L.variant==='vent')   L.canvas.hidden = vent==='No';
      if(L.variant==='novent') L.canvas.hidden = vent!=='No';
    });
  }

  /* ---------- foam accordion ---------- */
  var CHEV='<svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var foam=$('#foam');
  foam.innerHTML=ROWS.map(function(r){
    var s='<div class="fr" data-row="'+r.id+'">'+
      '<button type="button" class="hd" aria-expanded="false" aria-controls="o-'+r.id+'"><span class="nm">'+r.label+'</span>'+
      '<span class="val">Not selected</span>'+CHEV+'</button>'+
      '<div class="opts" id="o-'+r.id+'" role="radiogroup" aria-label="Foam – '+r.label+'">';
    FOAMS.forEach(function(f){
      var iid='f-'+r.id+'-'+f.code;
      s+='<span class="fo"><input type="radio" name="foam-'+r.id+'" id="'+iid+'" value="'+f.code+'" tabindex="-1">'+
         '<label for="'+iid+'" title="'+f.code+' '+f.grade+' – '+f.color+'"><span class="c"><i style="background:'+f.hex+'"></i>'+f.code+'</span><small>'+f.grade+'</small></label></span>';
    });
    return s+'</div></div>';
  }).join('');

  function rowEl(id){return $('.fr[data-row="'+id+'"]');}
  function toggle(id,open){
    $$('.fr',foam).forEach(function(fr){
      var on = fr.dataset.row===id ? (open===undefined ? !fr.classList.contains('open') : open) : false;
      fr.classList.toggle('open',on);
      $('.hd',fr).setAttribute('aria-expanded',on);
      $$('input',fr).forEach(function(i){i.tabIndex=on?0:-1;});
    });
  }
  $$('.fr .hd',foam).forEach(function(h){
    h.addEventListener('click',function(){ toggle(h.parentNode.dataset.row); });
  });
  foam.addEventListener('change',function(e){
    var m=/^foam-(.+)$/.exec(e.target.name); if(!m) return;
    var row=m[1], f=FOAMS.filter(function(x){return x.code===e.target.value;})[0];
    state[row]=f;
    LAYERS.forEach(function(L){ if(L.row===row) paint(L); });
    var fr=rowEl(row);
    fr.classList.add('set'); fr.classList.remove('invalid');
    $('.val',fr).innerHTML='<i style="background:'+f.hex+'"></i>'+f.code+' '+f.grade;
    clearMsg();
  });
  /* close the row after a pick with the mouse / touch (keyboard users keep it open) */
  foam.addEventListener('click',function(e){
    var lb=e.target.closest&&e.target.closest('.fo label'); if(!lb || e.detail===0) return;
    var row=lb.closest('.fr').dataset.row;
    setTimeout(function(){ toggle(row,false); },180);
  });

  /* hover a row -> highlight its layer; hover / click the seat -> that row */
  function hl(row,on){
    (canv[row]||[]).forEach(function(c){c.classList.toggle('hl',on);});
    var fr=rowEl(row); if(fr) fr.classList.toggle('hl',on);
  }
  $$('.fr',foam).forEach(function(fr){
    var row=fr.dataset.row;
    fr.addEventListener('mouseenter',function(){hl(row,true);});
    fr.addEventListener('mouseleave',function(){hl(row,false);});
    fr.addEventListener('focusin',function(){hl(row,true);});
    fr.addEventListener('focusout',function(){hl(row,false);});
  });
  function hitRow(ev){
    for(var i=LAYERS.length-1;i>=0;i--){
      var L=LAYERS[i], c=L.canvas; if(c.hidden||!L.ready) continue;
      var r=c.getBoundingClientRect();
      if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom) continue;
      var px=Math.min(c.width-1,Math.floor((ev.clientX-r.left)/r.width*c.width)), py=Math.min(c.height-1,Math.floor((ev.clientY-r.top)/r.height*c.height));
      try{ if(c.getContext('2d').getImageData(px,py,1,1).data[3]>40) return L.row; }catch(e){ return L.row; }
    }
    return null;
  }
  var hovered=null;
  preview.addEventListener('mousemove',function(ev){
    var row=hitRow(ev); if(row===hovered) return;
    if(hovered) hl(hovered,false); hovered=row; if(row) hl(row,true);
    preview.style.cursor=row?'pointer':'default';
  });
  preview.addEventListener('mouseleave',function(){ if(hovered) hl(hovered,false); hovered=null; });
  preview.addEventListener('click',function(ev){
    var row=hitRow(ev); if(!row) return;
    if(current!==1) go(1);
    var fr=rowEl(row);
    toggle(row,true);
    fr.scrollIntoView({behavior:'smooth',block:'center'});
    fr.classList.remove('flash'); void fr.offsetWidth; fr.classList.add('flash');
  });

  document.addEventListener('change',function(e){
    if(e.target.name==='ventilation') visibility();
    var g=e.target.closest&&e.target.closest('.yn'); if(g){ g.classList.remove('invalid'); clearMsg(); }
  });
  visibility();

  /* ---------- validation ---------- */
  function clearMsg(){ if(!$('#step-1 .invalid')) $('#step-1 .msg').textContent=''; }
  function validate(){
    var bad=[];
    $$('#step-1 .yn').forEach(function(g){ if(!radio(g.dataset.name)) bad.push(g); });
    ROWS.forEach(function(r){ if(!state[r.id]) bad.push(rowEl(r.id)); });
    return bad;
  }
  function showErrors(bad){
    var msg=$('#step-1 .msg');
    $$('.invalid').forEach(function(e){e.classList.remove('invalid');});
    if(!bad.length){msg.textContent='';return true;}
    bad.forEach(function(e){e.classList.add('invalid');});
    var foamOnly=bad.every(function(e){return e.classList.contains('fr');});
    msg.textContent = foamOnly ? 'Please pick a foam for every layer.' : 'Please answer all questions and pick a foam for every layer.';
    bad[0].scrollIntoView({behavior:'smooth',block:'center'});
    return false;
  }

  /* ---------- navigation ---------- */
  var TITLES={1:'Customize your Supportec seating.',2:'Customize your Supportec seating.'};
  var current=1;
  function go(n){
    current=n;
    document.body.className='step-'+n;
    $$('.step').forEach(function(s){s.classList.remove('active');});
    $('#step-'+n).classList.add('active');
    $('#title').textContent=TITLES[n];
    window.scrollTo({top:0,behavior:'smooth'});
  }
  $('#next').addEventListener('click',function(){ if(showErrors(validate())) go(2); });
  $('#back').addEventListener('click',function(){ go(1); });

  /* ---------- the chosen structure + foams, for the next step ---------- */
  window.getSupportecSelection = function(){
    var out={};
    $$('#step-1 .yn').forEach(function(g){ out[g.dataset.label]=radio(g.dataset.name); });
    out.Foam={};
    ROWS.forEach(function(r){ var f=state[r.id]; out.Foam[r.label]=f?f.code+' '+f.grade+' ('+f.color+')':''; });
    return out;
  };
})();
</script>
</body>
